# String is used on the autocomplete row when the login origin is a domain match with the document origin
displaySameOrigin = من هذا الموقع
# LOCALIZATION NOTE (autocompleteEditLogin):
# Accessible label for the edit button shown on a saved-login row in the
# autocomplete popup.
autocompleteEditLogin = حرّر الولوج
