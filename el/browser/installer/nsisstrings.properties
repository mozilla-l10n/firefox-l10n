INSTALLER_WIN_CAPTION = Πρόγραμμα εγκατάστασης του $BrandShortName
STUB_CLEANUP_PAVEOVER_HEADER3 = Έχετε ήδη εγκαταστήσει το $BrandShortName. Ας το ενημερώσουμε στην πιο πρόσφατη έκδοση.
STUB_CLEANUP_REINSTALL_HEADER3 = Έχετε ήδη εγκαταστήσει το $BrandShortName. Ας αποκτήσουμε ένα νέο αντίγραφο.
STUB_CLEANUP_PAVEOVER_BUTTON2 = Ενημέρωση
STUB_CLEANUP_REINSTALL_BUTTON2 = Επανεγκατάσταση
STUB_CLEANUP_CHECKBOX_LABEL3 = Εκκαθάριση και επιτάχυνση. Επιστροφή στις προεπιλεγμένες ρυθμίσεις και διαγραφή παλαιών προσθέτων.
STUB_INSTALLING_LABEL2 = Γίνεται εγκατάσταση…
STUB_BLURB_FIRST3 = Ετοιμαστείτε να περιπλανηθείτε στο ανοικτό διαδίκτυο
STUB_BLURB_SECOND2 = Γρήγορο. Ασφαλές. Με αυτόματο αποκλεισμό ιχνηλατών.
STUB_BLURB_THIRD2 = Σας ευχαριστούμε που δημιουργείτε ένα καλύτερο διαδίκτυο μαζί μας
STUB_BLURB_FIRST2_DEVEDITION = Ετοιμαστείτε να δημιουργήσετε για το ανοικτό διαδίκτυο
STUB_BLURB_SECOND2_DEVEDITION = Πανίσχυρο. Ιδιωτικό. Για προγραμματιστές.
STUB_BLURB_THIRD2_DEVEDITION = Σας ευχαριστούμε που είστε μέλος της κοινότητας του $BrandShortName
WARN_MIN_SUPPORTED_OSVER_MSG2 = Φαίνεται ότι δεν είναι δυνατή η εγκατάσταση του $BrandShortName. Αυτή η έκδοση του $BrandShortName απαιτεί ${MinSupportedVer} ή νεότερο. Κάντε κλικ στο κουμπί «OK» για επιπλέον πληροφορίες.
WARN_MIN_SUPPORTED_CPU_MSG2 = Φαίνεται ότι δεν είναι δυνατή η εγκατάσταση του $BrandShortName. Αυτή η έκδοση του $BrandShortName απαιτεί έναν επεξεργαστή με υποστήριξη ${MinSupportedCPU}. Κάντε κλικ στο κουμπί «OK» για επιπλέον πληροφορίες.
WARN_MIN_SUPPORTED_OSVER_CPU_MSG2 = Φαίνεται ότι δεν είναι δυνατή η εγκατάσταση του $BrandShortName. Αυτή η έκδοση του $BrandShortName απαιτεί ${MinSupportedVer} ή νεότερο και έναν επεξεργαστή με υποστήριξη ${MinSupportedCPU}. Κάντε κλικ στο κουμπί «OK» για επιπλέον πληροφορίες.
WARN_WRITE_ACCESS_QUIT2 = Φαίνεται ότι δεν επιτρέπεται να κάνετε εγκατάσταση στη συγκεκριμένη τοποθεσία αρχείου.
WARN_DISK_SPACE_QUIT2 = Φαίνεται ότι δεν διαθέτετε επαρκή αποθηκευτικό χώρο στη συσκευή σας για να εγκαταστήσετε το $BrandShortName.
ERROR_DOWNLOAD_CONT2 = Φαίνεται ότι δεν ήταν δυνατή η εγκατάσταση του $BrandShortName. Επιλέξτε «OK» για να ξεκινήσετε από την αρχή.
STUB_CANCEL_PROMPT_HEADING = Θέλετε να εγκαταστήσετε το $BrandShortName;
STUB_CANCEL_PROMPT_MESSAGE = Αν ακυρώσετε, το $BrandShortName δεν θα εγκατασταθεί.
STUB_CANCEL_PROMPT_BUTTON_CONTINUE = Εγκατάσταση του $BrandShortName
STUB_CANCEL_PROMPT_BUTTON_EXIT = Ακύρωση
