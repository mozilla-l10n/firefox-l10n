# LOCALIZATION NOTE (rule.status): For each style property the panel shows
# the rules which hold that specific property. For every rule, the rule status
# is also displayed: a rule can be the best match, a match, a parent match, or a
# rule did not match the element the user has highlighted.
rule.status.BEST = بهترین انطباق
rule.status.MATCHED = منطبق‌شده
rule.status.PARENT_MATCH = انطباق والد
# LOCALIZATION NOTE (rule.sourceElement, rule.sourceInline,
# rule.sourceConstructed, sourceElementAttributesStyle): For each style property the panel
# shows the rules which hold that specific property.
# For every rule, the rule source is also displayed: a rule can come from a
# file, from the same page (inline), from a constructed style sheet
# (constructed), or from the element itself (element).
rule.sourceInline = درون‌خطی (inline)
rule.sourceConstructed = ساخته‌شده (constructed)
rule.sourceElement = عنصر (element)
rule.sourceElementAttributesStyle = سبک صفت‌های عنصر
# LOCALIZATION NOTE (rule.inheritedFrom): Shown for CSS rules
# that were inherited from a parent node. Will be passed a node
# identifier of the parent node.
# e.g "Inherited from body#bodyID"
rule.inheritedFrom = به ارث‌رسیده از %S
# LOCALIZATION NOTE (rule.keyframe): Shown for CSS Rules keyframe header.
# Will be passed an identifier of the keyframe animation name.
rule.keyframe = فریم‌های کلیدی (Keyframes) %S
# LOCALIZATION NOTE (rule.userAgentStyles): Shown next to the style sheet
# link for CSS rules that were loaded from a user agent style sheet.
# These styles will not be editable, and will only be visible if the
# devtools.inspector.showUserAgentStyles pref is true.
rule.userAgentStyles = (عامل کاربر)
# LOCALIZATION NOTE (rule.pseudoElement): Shown for CSS rules
# pseudo element header
rule.pseudoElement = شبه‌عنصرها (Pseudo-elements)
# LOCALIZATION NOTE (rule.selectedElement): Shown for CSS rules element header if
# pseudo elements are present in the rule view.
rule.selectedElement = این عنصر
# LOCALIZATION NOTE (rule.warning.title): When an invalid property value is
# entered into the rule view a warning icon is displayed. This text is used for
# the title attribute of the warning icon.
rule.warning.title = مقدار ویژگی نامعتبر است
# LOCALIZATION NOTE (rule.warningName.title): When an invalid property name is
# entered into the rule view a warning icon is displayed. This text is used for
# the title attribute of the warning icon.
rule.warningName.title = نام ویژگی نامعتبر است
# LOCALIZATION NOTE (rule.warningInvalidAtComputedValueTime.title): When a property value
# is invalid at computed time in the rule view, a warning icon is displayed.
# This text is used for the title attribute of the warning icon.
# The argument is the expected CSS syntax (e.g. '<color>').
rule.warningInvalidAtComputedValueTime.title = مقدار ویژگی با نحو مورد انتظار %S مطابقت ندارد
# LOCALIZATION NOTE (rule.filterProperty.title): Text displayed in the tooltip
# of the search button that is shown next to a property that has been overridden
# in the rule view.
rule.filterProperty.title = پالایش قواعد حاوی این ویژگی
# LOCALIZATION NOTE (rule.variableJumpDefinition.title): Text displayed in the tooltip
# of the ↱ button that is shown next to a CSS variable used in a declaration value in the
# rule view.
rule.variableJumpDefinition.title = پرش به تعریف متغیر
# LOCALIZATION NOTE (rule.jumpDeclaration.title): Text displayed in the tooltip
# of the ↱ button that is shown next to a declaration value in the computed panel
# matched selectors section.
rule.jumpDeclaration.title = پرش به اعلان (Declaration)
# LOCALIZATION NOTE (rule.showUnusedCssVariable): Text for the button displayed in the rules
# view when some of the CSS variables of the rule are hidden.
# This is a semi-colon list of plural forms.
# See: http://developer.mozilla.org/en/docs/Localization_and_Plurals
##1 is the number of hidden unused variables
# example: Show 345 unused custom CSS properties.
rule.showUnusedCssVariable = نمایش #1 ویژگی سفارشی استفاده‌نشدهٔ CSS;نمایش همهٔ #1 ویژگی سفارشی استفاده‌نشدهٔ CSS
# LOCALIZATION NOTE (rule.empty): Text displayed when the highlighter is
# first opened and there's no node selected in the rule view.
rule.empty = هیچ عنصری انتخاب نشده است.
# LOCALIZATION NOTE (rule.variableUnset): Text displayed in a tooltip
# when the mouse is over a variable use (like "var(--something)"),
# where the variable is not set. The argument is the variable name.
rule.variableUnset = متغیر %S مقداردهی نشده است
# LOCALIZATION NOTE (rule.attributeUnset): Text displayed in a tooltip
# when the mouse is over an attribute use (like "attr(data-something)"),
# where the attribute is not set on the element. The argument is the attribute name.
rule.attributeUnset = صفت %S روی عنصر تنظیم نشده است
# LOCALIZATION NOTE (rule.attributeNotNumber): Text displayed in a tooltip
# when the mouse is over an attribute use (like "attr(data-something number)"),
# where the attribute value is not a number. The argument is the attribute value.
rule.attributeNotNumber = مقدار صفت (%S) یک مقدار عددی معتبر نیست
# LOCALIZATION NOTE (rule.attributeUnmatchedType): Text displayed in a tooltip
# when the mouse is over an attribute use (like "attr(data-something type(<color>))"),
# where the attribute value does not match the syntax declared in `type()`.
# The first argument is the attribute value.
# The second argument is the syntax defined in `type()`.
rule.attributeUnmatchedType = مقدار صفت (%1$S) با نحو مورد انتظار %2$S مطابقت ندارد
# LOCALIZATION NOTE (rule.variableEmpty): Text displayed in a tooltip in the rule view
