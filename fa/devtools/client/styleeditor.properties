# LOCALIZATION NOTE  (inlineStyleSheet): This is the name used for an style sheet
# that is declared inline in the <style> element. Shown in the stylesheets list.
# the argument is the index (order) of the containing <style> element in the
# document.
inlineStyleSheet = <inline style sheet #%S>
# LOCALIZATION NOTE  (constructedStyleSheet): This is the name used for an style sheet
# that is inserted via document.adoptedStyleSheets. Shown in the stylesheets list.
# the argument is the index (order) of the stylesheet in document.adoptedStyleSheets.
constructedStyleSheet = <برگهٔ سبک ساخته‌شده #%S>
# LOCALIZATION NOTE  (newStyleSheet): This is the default name for a new
# user-created style sheet.
newStyleSheet = صفحه تم جدید #%S
# LOCALIZATION NOTE  (error-load): This is shown when loading fails.
error-load = برگ شیوه قادر به بارگذاری نمی‌باشد.
# LOCALIZATION NOTE  (error-save): This is shown when saving fails.
error-save = برگ شیوه قادر به ذخیره شدن نیست.
# LOCALIZATION NOTE  (importStyleSheet.title): This is the file picker title,
# when you import a style sheet into the Style Editor.
importStyleSheet.title = وارد کردن برگ شیوه
# LOCALIZATION NOTE  (importStyleSheet.filter): This is the *.css filter title
importStyleSheet.filter = فایل‌های CSS
# LOCALIZATION NOTE  (saveStyleSheet.title): This is the file picker title,
# when you save a style sheet from the Style Editor.
saveStyleSheet.title = ذخیره کردن برگ شیوه
# LOCALIZATION NOTE  (saveStyleSheet.filter): This is the *.css filter title
saveStyleSheet.filter = فایل‌های CSS
# LOCALIZATION NOTE  (saveStyleSheet.commandkey): This the key to use in
# conjunction with accel (Command on Mac or Ctrl on other platforms) to Save
saveStyleSheet.commandkey = S
# LOCALIZATION NOTE  (focusFilterInput.commandkey): This is the key to use in
# conjunction with accel (Command on Mac or Ctrl on other platforms) to focus the
# filter input. Don't use "F" as it's used by the CodeMirror editor to perform an
# in-file search; if possible, keep it the same as sources.search.key2.
focusFilterInput.commandkey = P
# LOCALIZATION NOTE  (showOriginalSources.label): This is the label on the context
# menu item to toggle showing original sources in the editor.
showOriginalSources.label = نمایش منابع اصلی
# LOCALIZATION NOTE  (showOriginalSources.accesskey): This is the access key for
# the menu item to toggle showing original sources in the editor.
showOriginalSources.accesskey = ن
# LOCALIZATION NOTE  (showAtRulesSidebar.label): This is the label on the context
# menu item to toggle showing at-rules shortcuts in a sidebar.
# "@media" and "@supports" should not be translated as they are CSS rule identifiers.
showAtRulesSidebar.label = نمایش نوار کناری قاعده‌های @ (@media، @supports، …)
# LOCALIZATION NOTE  (showAtRulesSidebar.accesskey): This is the access key for
# the menu item to toggle showing the at-rules sidebar.
showAtRulesSidebar.accesskey = ق
