ImageMapRectBoundsError = مشخصهٔ «coords» برچسب ‪<area shape="rect">‬ در قالب «‪left,top,right,bottom‬» نیست.
ImageMapCircleWrongNumberOfCoords = مشخصهٔ «coords» برچسب ‪<area shape="circle">‬ در قالب «‪center-x,center-y,radius‬» نیست.
ImageMapCircleNegativeRadius = مشخصهٔ «coords» برچسب ‪<area shape="circle">‬ دارای «radius» منفی است.
ImageMapPolyWrongNumberOfCoords = مشخصهٔ «coords» برچسب ‪<area shape="poly">‬ در قالب «‪x1,y1,x2,y2 …‬» نیست.
ImageMapPolyOddNumberOfCoords = مشخصهٔ «coords» برچسب ‪<area shape="poly">‬ آخرین مختص «y» را کم دارد (قالب درست «‪x1,y1,x2,y2 …‬» است).
ScrollLinkedEffectFound3 = به نظر می‌رسد این سایت از جلوهٔ موقعیت‌دهی وابسته به پیمایش استفاده می‌کند. این جلوه ممکن است با جابه‌جایی ناهمگام خوب کار نکند؛ برای جزئیات بیشتر و پیوستن به گفت‌وگو دربارهٔ ابزارها و قابلیت‌های مرتبط، https://firefox-source-docs.mozilla.org/performance/scroll-linked_effects.html را ببینید!
## LOCALIZATION NOTE(CompositorAnimationWarningContentTooLargeArea):
## %1$S is an integer value of the area of the frame
## %2$S is an integer value of the area of a limit based on the viewport size
CompositorAnimationWarningContentTooLargeArea = پویانمایی روی ترکیب‌گر اجرا نمی‌شود، چون مساحت قاب (%1$S) نسبت به درگاه دید بیش از حد بزرگ است (بزرگ‌تر از %2$S)
## LOCALIZATION NOTE(CompositorAnimationWarningContentTooLarge2):
## (%1$S, %2$S) is a pair of integer values of the frame size
## (%3$S, %4$S) is a pair of integer values of a limit based on the viewport size
## (%5$S, %6$S) is a pair of integer values of an absolute limit
CompositorAnimationWarningContentTooLarge2 = پویانمایی روی ترکیب‌گر اجرا نمی‌شود، چون اندازهٔ قاب (%1$S، %2$S) نسبت به درگاه دید بیش از حد بزرگ است (بزرگ‌تر از (%3$S، %4$S)) یا از حداکثر مقدار مجاز (%5$S، %6$S) بزرگ‌تر است
## LOCALIZATION NOTE(CompositorAnimationWarningNonScalingStroke,
##                   CompositorAnimationWarningTransformSVG,
##                   CompositorAnimationWarningTransformFrameInactive,
##                   CompositorAnimationWarningOpacityFrameInactive):
## 'transform' and 'opacity' mean CSS property names, don't translate it.
CompositorAnimationWarningNonScalingStroke = پویانمایی‌های ‘transform’ روی محتوایی که عناصر non-scaling-stroke دارد روی ترکیب‌گر اجرا نمی‌شوند
CompositorAnimationWarningTransformSVG = پویانمایی‌های ‘transform’ روی عناصری که تبدیل‌های SVG دارند روی ترکیب‌گر اجرا نمی‌شوند
CompositorAnimationWarningTransformFrameInactive = پویانمایی روی ترکیب‌گر اجرا نمی‌شود، چون قاب برای پویانمایی ‘transform’ فعال علامت‌گذاری نشده است
CompositorAnimationWarningTransformIsBlockedByImportantRules = پویانمایی transform روی ترکیب‌گر اجرا نمی‌شود، چون ویژگی‌های مرتبط با transform با قاعده‌های ‎!important بازنویسی شده‌اند
CompositorAnimationWarningOpacityFrameInactive = پویانمایی روی ترکیب‌گر اجرا نمی‌شود، چون قاب برای پویانمایی ‘opacity’ فعال علامت‌گذاری نشده است
CompositorAnimationWarningHasRenderingObserver = پویانمایی روی ترکیب‌گر اجرا نمی‌شود، چون عنصر ناظر رندر دارد (‎-moz-element یا برش/پوشش SVG)
CompositorAnimationWarningHasCurrentColor = پویانمایی‌های ‘background-color’ با کلیدفریم ‘current-color’ روی ترکیب‌گر اجرا نمی‌شوند.
## LOCALIZATION NOTE(PrincipalWritingModePropagationWarning):
## Do not translate <html>, <body>, CSS, "writing-mode", "direction", "text-orientation", :root, and "The Principal Writing Mode" because they are technical terms.
PrincipalWritingModePropagationWarning = هنگام رندر عنصر <html>، مقادیر استفاده‌شدهٔ ویژگی‌های CSS «writing-mode»، «direction» و «text-orientation» روی عنصر <html> از مقادیر محاسبه‌شدهٔ عنصر <body> گرفته می‌شوند، نه از مقادیر خود عنصر <html>. بهتر است این ویژگی‌ها را روی شبه‌کلاس CSS ‏:root تنظیم کنید. برای اطلاعات بیشتر «The Principal Writing Mode» را در https://www.w3.org/TR/css-writing-modes-3/#principal-flow ببینید
## LOCALIZATION NOTE(ScrollAnchoringDisabledInContainer):
## %1$S is an integer value with the total number of adjustments
## %2$S is a floating point value with the average distance adjusted
## %3$S is a floating point value with the total adjusted distance
ScrollAnchoringDisabledInContainer = لنگراندازی پیمایش در یک نگه‌دارندهٔ پیمایش غیرفعال شد، چون تعداد تنظیم‌های پیاپی زیاد (%1$S) و مسافت کل کم بود (میانگین %2$S پیکسل، مجموع %3$S پیکسل).
ForcedLayoutStart = چیدمان پیش از بار شدن کامل صفحه اجباری انجام شد. اگر برگه‌های سبک هنوز بار نشده باشند، ممکن است محتوا لحظه‌ای بدون سبک نمایش داده شود.
