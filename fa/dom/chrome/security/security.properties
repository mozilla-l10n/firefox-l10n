# LOCALIZATION NOTE: Do not translate "X-Content-Type-Options" and also do not translate "nosniff".
XCTOHeaderValueMissing = هشدار هدر X-Content-Type-Options: مقدار هدر «%1$S» بود؛ آیا قصد ارسال «nosniff» را داشتید؟
# LOCALIZATION NOTE: Do not translate "X-Content-Type-Options" and also do not translate "nosniff".
