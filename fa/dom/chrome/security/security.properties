# LOCALIZATION NOTE: “%S” is the whole URI of the loaded file.
BlockExtensionScriptWithWrongExt = بارگیری اسکریپت با نشانی «%S» مسدود شد زیرا پسوند فایل مجاز نیست.
RestrictBrowserEvalUsage = استفاده از ()eval و کاربردهای مشابه آن در فرآیند والد (Parent Process) یا زمینه‌های سیستمی (System Contexts) مجاز نیست (استفاده در «%1$S» مسدود شد)
# LOCALIZATION NOTE (MixedContentAutoUpgrade):
