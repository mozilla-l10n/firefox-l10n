BlockScriptWithWrongMimeType2 = اسکریپت دریافتی از «%1$S» به دلیل نوع MIME غیرمجاز («%2$S») مسدود شد.
WarnScriptWithWrongMimeType = اسکریپت دریافتی از «%1$S» بارگیری شد، اگرچه نوع MIME آن («%2$S») یک نوع MIME معتبر برای جاوااسکریپت نیست.
