HTTPSFirstSchemeless = ارتقای نشانی بارگیری‌شده در نوار نشانیِ بدون طرح‌وارهٔ مشخص پروتکل (scheme) برای استفاده از HTTPS.
# LOCALIZATION NOTE: %S is the hostname for which a exception will be added;
HTTPSFirstAddingException = افزودن استثنا برای جلوگیری موقت از تلاش‌های بعدی به منظور بارگیری خودکار و امن «http://%S».
# LOCALIZATION NOTE: %S is the URL of the blocked request;
IframeSandboxBlockedDownload = دانلود «%S» مسدود شد زیرا iframe آغازگر دارای پرچم sandbox است.
# LOCALIZATION NOTE: %S is the URL of the blocked request;
SandboxBlockedCustomProtocols = مسیریابی به پروتکل سفارشی «%S» از یک بافت سندباکس مسدود شد.
