BlockWorkerWithWrongMimeType = بارگیری Worker از «%1$S» به دلیل نوع MIME غیرمجاز («%2$S») مسدود شد.
BlockModuleWithWrongMimeType = بارگیری ماژول از «%1$S» به دلیل نوع MIME غیرمجاز («%2$S») مسدود شد.
