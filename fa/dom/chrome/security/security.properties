# Mixed Content Blocker
# LOCALIZATION NOTE: "%1$S" is the URI of the blocked mixed content resource
BlockMixedDisplayContent = بارگیری محتوای نمایشی ترکیبی (mixed display content) «%1$S» مسدود شد
BlockMixedActiveContent = بارگیری محتوای فعال ترکیبی (mixed active content) «%1$S» مسدود شد
# CORS
# LOCALIZATION NOTE: Do not translate "Access-Control-Allow-Origin", Access-Control-Allow-Credentials, Access-Control-Allow-Methods, Access-Control-Allow-Headers
CORSDisabled = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: غیرفعال بودن CORS).
CORSDidNotSucceed2 = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: درخواست CORS موفقیت‌آمیز نبود). کد وضعیت: %2$S.
CORSOriginHeaderNotAdded = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: هدر CORS با نام «Origin» اضافه نمی‌شود).
CORSExternalRedirectNotAllowed = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: تغییر مسیر خارجی درخواست CORS مجاز نیست).
CORSRequestNotHttp = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: درخواست CORS از نوع http نیست).
CORSMissingAllowOrigin2 = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: هدر CORS با نام «Access-Control-Allow-Origin» وجود ندارد). کد وضعیت: %2$S.
CORSMultipleAllowOriginNotAllowed = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: وجود چندین هدر CORS با نام «Access-Control-Allow-Origin» مجاز نیست).
CORSAllowOriginNotMatchingOrigin = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: هدر CORS با نام «Access-Control-Allow-Origin» با «%2$S» هم‌خوانی ندارد).
CORSNotSupportingCredentials = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در «%1$S» را نمی‌دهد. (علت: در صورتی که مقدار هدر CORS با نام «Access-Control-Allow-Origin» برابر با «*» باشد، اطلاعات کاربری/اعتبارسنجی پشتیبانی نمی‌شود).
CORSMethodNotFound = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: متدی در هدر CORS با نام «Access-Control-Allow-Methods» یافت نشد).
CORSMissingAllowCredentials = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: مقدار «true» در هدر CORS با نام «Access-Control-Allow-Credentials» مورد انتظار بود).
CORSPreflightDidNotSucceed3 = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: پاسخ CORS preflight موفقیت‌آمیز نبود). کد وضعیت: %2$S.
CORSInvalidAllowMethod = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: توکن نامعتبر «%2$S» در هدر CORS با نام «Access-Control-Allow-Methods»).
CORSInvalidAllowHeader = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: توکن نامعتبر «%2$S» در هدر CORS با نام «Access-Control-Allow-Headers»).
CORSMissingAllowHeaderFromPreflight2 = درخواست Cross-Origin مسدود شد: سیاست مبدا یکسان (Same Origin Policy) اجازهٔ خواندن منبع از راه دور در %1$S را نمی‌دهد. (علت: هدر «%2$S» طبق هدر «Access-Control-Allow-Headers» از پاسخ CORS preflight مجاز نیست).
CORSAllowHeaderFromPreflightDeprecation = هشدار درخواست Cross-Origin: سیاست مبدا یکسان (Same Origin Policy) به‌زودی خواندن منبع از راه دور در %1$S را مسدود خواهد کرد. (علت: هنگامی که «Access-Control-Allow-Headers» برابر با «*» باشد، هدر «Authorization» شامل آن نمی‌شود. برای لحاظ شدن هدر «Authorization»، این هدر باید صراحتاً در هدر CORS با نام «Access-Control-Allow-Headers» قید شود).
# LOCALIZATION NOTE: Do not translate "Strict-Transport-Security", "HSTS", "max-age" or "includeSubDomains"
STSUnknownError = خطای Strict-Transport-Security: هنگام پردازش هدر مشخص‌شده توسط سایت، خطای ناشناخته‌ای رخ داد.
STSCouldNotParseHeader = خطای Strict-Transport-Security: تجزیهٔ هدر مشخص‌شده توسط سایت ناموفق بود.
STSNoMaxAge = خطای Strict-Transport-Security: هدر مشخص‌شده توسط سایت شامل دستورالعمل «max-age» نبود.
STSMultipleMaxAges = خطای Strict-Transport-Security: هدر مشخص‌شده توسط سایت شامل چندین دستورالعمل «max-age» بود.
STSInvalidMaxAge = خطای Strict-Transport-Security: هدر مشخص‌شده توسط سایت شامل دستورالعمل نامعتبر «max-age» است.
STSMultipleIncludeSubdomains = خطای Strict-Transport-Security: هدر مشخص‌شده توسط سایت شامل چندین دستورالعمل «includeSubDomains» بود.
STSInvalidIncludeSubdomains = خطای Strict-Transport-Security: هدر مشخص‌شده توسط سایت شامل دستورالعمل نامعتبر «includeSubDomains» است.
STSCouldNotSaveState = خطای Strict-Transport-Security: در ثبت سایت به عنوان میزبان Strict-Transport-Security خطایی رخ داد.
InsecurePasswordsPresentOnPage = فیلدهای گذرواژه در یک صفحهٔ ناامن (http://) قرار دارند. این یک ریسک امنیتی است که امکان به سرقت رفتن اطلاعات ورود کاربر را فراهم می‌کند.
InsecureFormActionPasswordsPresent = فیلدهای گذرواژه درون فرمی با پراپرتی ناامنِ action (http://) قرار دارند. این یک ریسک امنیتی است که امکان به سرقت رفتن اطلاعات ورود کاربر را فراهم می‌کند.
InsecurePasswordsPresentOnIframe = فیلدهای گذرواژه در یک iframe ناامن (http://) قرار دارند. این یک ریسک امنیتی است که امکان به سرقت رفتن اطلاعات ورود کاربر را فراهم می‌کند.
# LOCALIZATION NOTE: "%1$S" is the URI of the insecure mixed content resource
LoadingMixedActiveContent2 = در حال بارگیری محتوای فعال ترکیبیِ (ناامن) «%1$S» روی یک صفحهٔ امن
LoadingMixedDisplayContent2 = در حال بارگیری محتوای نمایشیِ ترکیبیِ (ناامن) «%1$S» روی یک صفحهٔ امن
# LOCALIZATION NOTE: "%S" is the URI of the insecure mixed content download
MixedContentBlockedDownload = دانلود محتوای ناامن «%S» مسدود شد.
# LOCALIZATION NOTE: Do not translate "allow-scripts", "allow-same-origin", "sandbox" or "iframe"
BothAllowScriptsAndSameOriginPresent = یک iframe که برای مشخصهٔ sandbox خود هر دو مقدار allow-scripts و allow-same-origin را دارد، می‌تواند sandboxing خود را دور بزند یا حذف کند.
# LOCALIZATION NOTE: Do not translate "allow-top-navigation-by-user-activation", "allow-top-navigation", "sandbox" or "iframe"
BothAllowTopNavigationAndUserActivationPresent = یک iframe که برای مشخصهٔ sandbox خود هر دو مقدار allow-top-navigation و allow-top-navigation-by-user-activation را دارد، به مسیریابی در سطح بالا (top navigation) اجازه خواهد داد.
# Sub-Resource Integrity
# LOCALIZATION NOTE: Do not translate "script" or "integrity". "%1$S" is the invalid token found in the attribute.
MalformedIntegrityHash = عنصر script دارای یک هش با ساختار نادرست در مشخصهٔ integrity خود است: «%1$S». قالب صحیح به صورت «<hash algorithm>-<hash value>» است.
# LOCALIZATION NOTE: Do not translate "integrity"
InvalidIntegrityLength = طول هش موجود در مشخصهٔ integrity نادرست است.
# LOCALIZATION NOTE: Do not translate "integrity"
InvalidIntegrityBase64 = هش موجود در مشخصهٔ integrity قابل رمزگشایی (Base64) نبود.
# LOCALIZATION NOTE: Do not translate "integrity". "%1$S" is the type of hash algorithm in use (e.g. "sha256"). "%2$S" is the URI of the sub-resource. "%3$S" is the hash value we saw.
IntegrityMismatch3 = هیچ‌کدام از هش‌های «%1$S» در مشخصهٔ integrity با محتوای زیرمنبع موجود در «%2$S» مطابقت ندارند. هش محاسبه‌شده «%3$S» است.
# LOCALIZATION NOTE: "%1$S" is the URI of the sub-resource that cannot be protected using SRI.
IneligibleResource = منبع «%1$S» واجد شرایط بررسی یکپارچگی (SRI) نیست زیرا نه دارای CORS فعال است و نه هم‌مبدا (same-origin).
# LOCALIZATION NOTE: Do not translate "integrity". "%1$S" is the invalid hash algorithm found in the attribute.
UnsupportedHashAlg = الگوریتم هش پشتیبانی‌نشده در مشخصهٔ integrity: «%1$S»
# LOCALIZATION NOTE: Do not translate "integrity"
NoValidMetadata = مشخصهٔ integrity شامل متادیتای معتبری نیست.
# LOCALIZATION NOTE: Do not translate "RC4".
WeakCipherSuiteWarning = این سایت برای رمزگذاری از الگوریتم RC4 استفاده می‌کند که منسوخ‌شده و ناامن است.
DeprecatedTLSVersion2 = این سایت از نسخهٔ منسوخ‌شدهٔ TLS استفاده می‌کند. لطفاً به TLS 1.2 یا 1.3 ارتقا دهید.
