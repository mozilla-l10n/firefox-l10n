# LOCALIZATION NOTE: %S is the URI of the blocked script.
IntegrityPolicyReportOnlyBlockedScript = (سیاست Report-Only) تنظیمات صفحه اسکریپت را در %S به دلیل نداشتن متادیتای integrity مسدود می‌کرد.
# LOCALIZATION NOTE: %S is the URI of the blocked stylesheet.
IntegrityPolicyEnforceBlockedStylesheet = تنظیمات صفحه از بارگیری شیوه‌نامه (stylesheet) در %S به دلیل نداشتن متادیتای integrity جلوگیری کرد.
# LOCALIZATION NOTE: %S is the URI of the blocked stylesheet.
IntegrityPolicyReportOnlyBlockedStylesheet = (سیاست Report-Only) تنظیمات صفحه شیوه‌نامه (stylesheet) را در %S به دلیل نداشتن متادیتای integrity مسدود می‌کرد.
# WAICT (Web Application Integrity, Consistency, and Transparency)
# LOCALIZATION NOTE: %1$S is the URL that could not be parsed from the manifest.
WAICTManifestURLParseError = ‏WAICT: تجزیهٔ نشانی اینترنتی «%1$S» از مانیفست ناموفق بود.
# LOCALIZATION NOTE: %1$S is the resource URI, %2$S is the expected hash from the manifest, %3$S is the computed hash.
WAICTHashMismatch = ‏WAICT: هش منبع «%1$S» مطابقت ندارد. مقدار مورد انتظار «%2$S» بود اما مقدار محاسبه‌شده «%3$S» است.
# LOCALIZATION NOTE: %1$S is the resource URI. %2$S is the computed hash.
WAICTResourceNotInManifest = ‏WAICT: منبع «%1$S» با هش محاسبه‌شدهٔ «%2$S» در مانیفست یکپارچگی (integrity manifest) یافت نشد.
# LOCALIZATION NOTE: %1$S is the header value.
WAICTHeaderParseError = ‏WAICT: تجزیهٔ هدر «%1$S» ناموفق بود.
# LOCALIZATION NOTE: %1$S is the header value. %2$S is the field name like destinations.
WAICTHeaderFieldParseError = ‏WAICT: تجزیهٔ %2$S در هدر «%1$S» ناموفق بود.
# LOCALIZATION NOTE: %1$S is the header value.
WAICTHeaderManifestParseError = ‏WAICT: نشانی مانیفست در هدر «%1$S» نامعتبر است یا وجود ندارد.
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTFetchingManifest = ‏WAICT: در حال واکشی مانیفست یکپارچگی از «%1$S».
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTManifestFetchURLParseError = ‏WAICT: تجزیهٔ نشانی مانیفست «%1$S» ناموفق بود.
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTManifestFetchError = ‏WAICT: واکشی مانیفست یکپارچگی از «%1$S» ناموفق بود.
WAICTManifestJSONParseError = ‏WAICT: تجزیهٔ JSON مانیفست ناموفق بود.
# LOCALIZATION NOTE: %1$S is the URL. %2$S is the computed hash.
WAICTManifestInvalidHash = ‏WAICT: مدخل «%1$S» در مانیفست دارای هش نامعتبر «%2$S» است.
# LOCALIZATION NOTE: %1$S is the URL.
WAICTManifestInvalidURL = ‏WAICT: مدخل «%1$S» در مانیفست نشانی اینترنتی نامعتبر است.
# LOCALIZATION NOTE: %1$S is the computed hash. Do not translate "any_hashes".
WAICTManifestInvalidAnyHash = ‏WAICT: مانیفست دارای یک هش نامعتبر «%1$S» در «any_hashes» است.
