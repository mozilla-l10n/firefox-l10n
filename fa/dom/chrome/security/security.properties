ReferrerPolicyDisallowRelaxingWarning = سیاست ارجاع‌دهنده (Referrer Policy): سیاست‌های با محدودیت کمتر، شامل «no-referrer-when-downgrade»، «origin-when-cross-origin» و «unsafe-url»، به‌زودی برای این درخواست بین‌سایتی نادیده گرفته خواهند شد: %S
# LOCALIZATION NOTE: %1$S is the ignored referrer policy, %2$S is the URI of the loading channel.
