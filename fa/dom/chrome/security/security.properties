FeaturePolicyInvalidAllowValue = خطای Feature Policy: رد کردن مقدار مجاز پشتیبانی‌نشدهٔ «%S».
# LOCALIZATION NOTE: "%1$S" is the limitation length (bytes) of referrer URI, "%2$S" is the origin of the referrer URI.
ReferrerLengthOverLimitation = هدر HTTP Referrer: طول بیش از حد مجاز «%1$S» بایت است - کاهش هدر ارجاع‌دهنده به مبدا (origin): «%2$S»
# LOCALIZATION NOTE: "%1$S" is the limitation length (bytes) of referrer URI, "%2$S" is the origin of the referrer URI.
ReferrerOriginLengthOverLimitation = هدر HTTP Referrer: طول مبدا درون ارجاع‌دهنده بیش از حد مجاز «%1$S» بایت است - حذف ارجاع‌دهنده با مبدا «%2$S».
