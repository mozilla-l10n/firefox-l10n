ReportingHeaderInvalidItem = هدر گزارش‌دهی (Reporting Header): نادیده گرفتن مورد نامعتبر با نام «%S».
ReportingHeaderInvalidEndpoint = هدر گزارش‌دهی (Reporting Header): نادیده گرفتن Endpoint نامعتبر برای موردی با نام «%S».
