ignoringUnsafeEval = نادیده گرفتن 'unsafe-eval' یا 'wasm-unsafe-eval' درون «%1$S».
# LOCALIZATION NOTE (strictDynamicButNoHashOrNonce):
# %1$S is the csp directive that contains 'strict-dynamic'
# 'strict-dynamic' should not be localized
strictDynamicButNoHashOrNonce = کلیدواژهٔ 'strict-dynamic' درون «%1$S» بدون هیچ nonce یا hash معتبری ممکن است مانع از بارگذاری همهٔ اسکریپت‌ها شود
