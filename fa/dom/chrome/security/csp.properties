# LOCALIZATION NOTE (reportURINorReportToNotInReportOnlyHeader):
# %1$S is the ETLD of the page with the policy
reportURINorReportToNotInReportOnlyHeader = این سایت (%1$S) دارای یک خط‌مشی Report-Only بدون هیچ‌کدام از دستورالعمل‌های report-uri یا report-to است. CSP هیچ نقضی از این خط‌مشی را مسدود نمی‌کند و قادر به گزارش آن نخواهد بود.
# LOCALIZATION NOTE (failedToParseUnrecognizedSource):
