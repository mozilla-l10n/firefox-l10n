upgradeInsecureRequest = ارتقای درخواست ناامن «%1$S» جهت استفاده از «%2$S»
# LOCALIZATION NOTE (ignoreSrcForDirective):
ignoreSrcForDirective = نادیده گرفتن srcها برای دستورالعمل «%1$S»
# LOCALIZATION NOTE (hostNameMightBeKeyword):
