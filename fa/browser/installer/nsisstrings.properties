WARN_MIN_SUPPORTED_OSVER_MSG2 = به نظر می‌رسد امکان نصب $BrandShortName وجود ندارد. این نسخه از $BrandShortName به ${MinSupportedVer} یا بالاتر نیاز دارد. لطفاً برای اطلاعات بیشتر روی دکمهٔ «تأیید» کلیک کنید.
