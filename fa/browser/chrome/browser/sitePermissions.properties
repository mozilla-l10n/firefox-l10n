# LOCALIZATION NOTE (state.current.allowed,
#                    state.current.allowedForSession,
#                    state.current.allowedTemporarily,
#                    state.current.blockedTemporarily,
#                    state.current.blocked,
#                    state.current.hide):
# This label is used to display active permission states in the site
# identity popup (which does not have a lot of screen space).
state.current.allowed = مجاز
state.current.allowedForSession = مجاز برای این نشست
state.current.allowedTemporarily = مجاز به‌طور موقت
state.current.blockedTemporarily = مسدود به‌طور موقت
state.current.blocked = مسدود
state.current.prompt = همیشه پرسیده شود
# LOCALIZATION NOTE (state.multichoice.alwaysAsk,
#                    state.multichoice.allow,
#                    state.multichoice.allowForSession,
#                    state.multichoice.block):
# Used to label permission state checkboxes in the page info dialog.
state.multichoice.alwaysAsk = همیشه پرسیده شود
state.multichoice.allow = مجاز بودن
state.multichoice.allowForSession = مجاز بودن برای این نشست
state.multichoice.block = مسدود کردن
state.multichoice.autoplayblock = مسدود کردن صدا
state.multichoice.autoplayblockall = مسدود کردن صدا و ویدیو
state.multichoice.autoplayallow = مجاز بودن صدا و ویدیو
# LOCALIZATION NOTE (state.multichoice.clearDataOnShutdown,
#                    state.multichoice.persistDataOnShutdown):
# Used to label the two states of the "keep site data when closing" permission
# in the page info dialog. "clearDataOnShutdown" is the default (the site's data
# is cleared when the browser closes); "persistDataOnShutdown" keeps it.
state.multichoice.clearDataOnShutdown = پاک‌سازی هنگام بستن
state.multichoice.persistDataOnShutdown = نگه‌داشتن همیشگی داده‌های سایت
