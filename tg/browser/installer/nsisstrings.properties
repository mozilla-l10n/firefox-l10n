WARN_MIN_SUPPORTED_OSVER_CPU_MSG2 = Чунин менамояд, ки «$BrandShortName» насб карда намешавад. Барои ин версияи «$BrandShortName» версияи ${MinSupportedVer} ё навтар ва просессор бо дастгирии {MinSupportedCPU} лозим аст. Лутфан, барои гирифтани маълумоти бештар, тугмаи «ХУБ»-ро зер кунед.
