toolbox.closebutton.tooltip = ਵਿਕਾਸਕਾਰ ਸੰਦਾਂ ਨੂੰ ਬੰਦ ਕਰੋ
# LOCALIZATION NOTE (toolbox.errorCountButtonConsoleTab.tooltip): This is the tooltip for
