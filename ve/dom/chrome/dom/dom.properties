KillScriptTitle=Tsivhudzo: Ḽiṅwalwa ḽi sa vulei
KillScriptMessage=Ḽiṅwalwa kha heḽi siaṱari ḽi nga vha ḽi tshi khou shuma, kana ḽi nga vha ḽo tou litsha u fhindula. Ni na imisa ḽiṅwalwa zwino, kana ni nga isa phanda u itela u vhona arali ḽiṅwalwa ḽi tshi ḓo fhedzisa.
