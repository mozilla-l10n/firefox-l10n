blockedByPolicyEnterprise = Diese Website wurde von Ihrer Organisation gesperrt.\nIhr Unternehmen hat Netzwerkbeschränkungen eingerichtet, die den Zugriff auf bestimmte Websites aus Sicherheits-, Compliance- oder Produktivitätsgründen verhindern.
# LOCALIZATION NOTE (profileNotEncryptedButPrefOnEnterprise): %S is the application name.
profileNotEncryptedButPrefOnEnterprise = %S erfordert jetzt einen verschlüsselten Speicher. Ihr vorhandenes Profil ist jedoch ungeschützt. Daher wird ein neues verschlüsseltes Profil erstellt, in dem die Synchronisierung den Großteil Ihrer Daten wiederherstellt.\n\nWir empfehlen dringend, das alte Profil zu löschen, da es beim Archivieren ungeschützt auf der Festplatte verbleibt.
# LOCALIZATION NOTE (profileMismatchDeleteAndContinue, profileMismatchKeepAndContinue, profileMismatchQuit): Button labels for the profile encryption migration dialog.
profileMismatchDeleteAndContinue = Löschen (empfohlen)
profileMismatchKeepAndContinue = Archiv
profileMismatchQuit = Beenden
