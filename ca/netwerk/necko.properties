RepostFormData = Aquesta pàgina web s'està redirigint a una altra ubicació. Voleu reenviar-hi les dades del formulari que heu introduït?
# Directory listing strings
DirTitle = Índex de %1$S
DirGoUp = Cap a un directori de nivell superior
ShowHidden = Mostra els objectes ocults
DirColName = Nom
DirColSize = Mida
DirColMTime = Darrera modificació
DirFileLabel = Fitxer:
TrackerUriBlockedByETP = S'ha blocat el recurs de «%1$S» perquè la protecció contra el seguiment millorada està activada.
UnsafeUriBlocked = La funció de navegació segura ha blocat el recurs del lloc «%1$S».
# LOCALIZATION NOTE (StrictUrlProtocolSetter): %1$S is the URL that has attempted to be changed. %2$S is the invalid target protocol.
StrictUrlProtocolSetter = S'ha blocat el canvi de l'URL «%1$S» al protocol «%2$S».
# LOCALIZATION NOTE (CORPBlocked): %1$S is the URL of the blocked resource. %2$S is the URL of the MDN page about CORP.
CORPBlocked = S'ha blocat el recurs de «%1$S» a causa de la seva capçalera Cross-Origin-Resource-Policy (o perquè no en té). Vegeu %2$S
CookieBlockedByPermission = S'ha blocat la sol·licitud d'accés a les galetes o a l'emmagatzematge en «%1$S» a causa del permís personalitzat de galetes.
CookieBlockedTrackerByETP = S'ha blocat la sol·licitud d'accés a les galetes o a l'emmagatzematge en «%1$S» perquè provenia d'un element de seguiment i la protecció contra el seguiment millorada està activada.
CookieBlockedAll = S'ha blocat la sol·licitud d'accés a les galetes o a l'emmagatzematge en «%1$S» perquè s'estan blocant totes les sol·licituds d'accés a l'emmagatzematge.
CookieBlockedForeignByETP = S'ha blocat la sol·licitud d'accés a les galetes o a l'emmagatzematge en «%1$S» perquè s'estan blocant totes les sol·licituds d'accés a l'emmagatzematge de tercers i la protecció contra el seguiment millorada està activada.
# As part of dynamic state partitioning, third-party resources might be limited to "partitioned" storage access that is separate from the first-party context.
# This allows e.g. cookies to still be set, and prevents tracking without totally blocking storage access. This message is shown in the web console when this happens
# to inform developers that their storage is isolated.
CookiePartitionedForeign2 = S'ha proporcionat accés particionat a les galetes o a l'emmagatzematge a «%1$S» perquè es carrega en un context de tercers i la partició dinàmica de l'estat està activada.
# LOCALIZATION NOTE (CookieAllowedForOriginByStorageAccessAPI): %2$S and %1$S are URLs.
CookieAllowedForOriginByStorageAccessAPI = S'ha concedit accés a l'emmagatzematge per a l'origen «%2$S» en «%1$S».
# LOCALIZATION NOTE (CookieAllowedForOriginByHeuristic): %2$S and %1$S are URLs.
CookieAllowedForOriginByHeuristic = S'ha concedit accés automàticament a l'emmagatzematge per a l'origen «%2$S» en «%1$S».
# LOCALIZATION NOTE (CookieAllowedForDFPIByHeuristic): %2$S and %1$S are URLs.
CookieAllowedForDFPIByHeuristic = S'ha concedit automàticament l'accés a l'emmagatzematge per a la partició dinàmica de l'estat «%2$S» en «%1$S».
# LOCALIZATION NOTE(CookieRejectedNonRequiresSecure2): %1$S is the cookie name. Do not localize "SameSite=None" and "secure".
CookieRejectedNonRequiresSecure2 = La galeta «%1$S» s'ha rebutjat perquè té l'atribut «SameSite=None», però li manca l'atribut «secure».
# LOCALIZATION NOTE(CookieRejectedNonRequiresSecureForBeta3): %1$S is the cookie name. %2$S is a URL. Do not localize "SameSite", "SameSite=None" and "secure".
CookieRejectedNonRequiresSecureForBeta3 = Aviat es rebutjarà la galeta «%1$S» perquè té l'atribut «SameSite» establert a «None» sense l'atribut «secure». Per a obtenir més informació sobre l'atribut «SameSite», llegiu %2$S
# LOCALIZATION NOTE(CookieLaxForced2): %1$S is the cookie name. Do not localize "SameSite", "Lax" and "SameSite=Lax".
CookieLaxForced2 = La galeta «%1$S» té la política «SameSite» establerta a «Lax» perquè no té cap atribut «SameSite», i «SameSite=Lax» és el valor per defecte d'aquest atribut.
# LOCALIZATION NOTE(CookieLaxForcedForBeta2): %1$S is the cookie name. %2$S is a URL. Do not localize "SameSite", "Lax" and "SameSite=Lax", "SameSite=None".
CookieLaxForcedForBeta2 = La galeta «%1$S» no té un valor adequat per a l'atribut «SameSite». Aviat, les galetes sense l'atribut «SameSite» o amb un valor no vàlid es tractaran com a «Lax». Això vol dir que la galeta ja no s'enviarà en contextos de tercers. Si la vostra aplicació depèn que aquesta galeta estigui disponible en aquests contextos, afegiu-hi l'atribut «SameSite=None». Per a obtenir més informació sobre l'atribut «SameSite», llegiu %2$S
# LOCALIZATION NOTE(CookieSameSiteValueInvalid2): %1$S is cookie name. Do not localize "SameSite", "Lax", "Strict" and "None"
CookieSameSiteValueInvalid2 = El valor «SameSite» de la galeta «%1$S» no és vàlid. Els valors admesos són: «Lax», «Strict», «None».
# LOCALIZATION NOTE(CookieInvalidMaxAgeAttribute): %1$S is cookie name. Do not localize "max-age".
CookieInvalidMaxAgeAttribute = El valor «max-age» de la galeta «%1$S» no és vàlid. S'ignora l'atribut.
# LOCALIZATION NOTE (CookieOversize): %1$S is the cookie name. %2$S is the number of bytes. "B" means bytes.
CookieOversize = La galeta «%1$S» no és vàlida perquè és massa gran. La mida màxima és %2$S B.
# LOCALIZATION NOTE (CookieRejectedByPermissionManager): %1$S is the cookie response header.
CookieRejectedByPermissionManager = La galeta «%1$S» s'ha rebutjat perquè l'usuari ha establert permisos que la rebutgen.
CookieRejectedEmptyNameAndValue = S'ha rebutjat una galeta amb un nom buit i un valor buit.
# LOCALIZATION NOTE (CookieRejectedInvalidCharName): %1$S is the cookie name.
CookieRejectedInvalidCharName = La galeta «%1$S» s'ha rebutjat perquè el nom conté caràcters no vàlids.
# LOCALIZATION NOTE (CookieRejectedInvalidCharAttributes): %1$S is the cookie name.
CookieRejectedInvalidCharAttributes = La galeta «%1$S» s'ha rebutjat perquè els atributs contenen caràcters no vàlids.
# LOCALIZATION NOTE (CookieRejectedInvalidDomain): %1$S is the cookie name.
CookieRejectedInvalidDomain = La galeta «%1$S» s'ha rebutjat perquè el domini no és vàlid.
# LOCALIZATION NOTE (CookieRejectedInvalidPrefix): %1$S is the cookie name.
CookieRejectedInvalidPrefix = La galeta «%1$S» s'ha rebutjat perquè el prefix no és vàlid.
# LOCALIZATION NOTE (CookieRejectedInvalidPath): %1$S is the cookie name.
CookieRejectedInvalidPath = La galeta «%1$S» s'ha rebutjat perquè el camí no és vàlid.
# LOCALIZATION NOTE (CookieRejectedInvalidCharValue): %1$S is the cookie name.
CookieRejectedInvalidCharValue = La galeta «%1$S» s'ha rebutjat perquè el valor conté caràcters no vàlids.
# LOCALIZATION NOTE (CookieRejectedAttributePathOversize): %1$S is the cookie name.
CookieRejectedAttributePathOversize = La galeta «%1$S» s'ha rebutjat perquè l'atribut de camí és massa gran.
# LOCALIZATION NOTE (CookieRejectedAttributeDomainOversize): %1$S is the cookie name.
CookieRejectedAttributeDomainOversize = La galeta «%1$S» s'ha rebutjat perquè l'atribut de domini és massa gran.
# LOCALIZATION NOTE (CookieRejectedAttributeExpiryOversize): %1$S is the cookie name.
CookieRejectedAttributeExpiryOversize = La galeta «%1$S» s'ha rebutjat perquè la data de caducitat supera el límit.
# LOCALIZATION NOTE (CookieRejectedHttpOnlyButFromScript): %1$S is the cookie name.
CookieRejectedHttpOnlyButFromScript = La galeta «%1$S» s'ha rebutjat perquè ja hi ha una galeta HTTP-Only, però un script ha intentat emmagatzemar-ne una de nova.
# LOCALIZATION NOTE (CookieRejectedSecureButHttp): %1$S is the cookie name.
CookieRejectedSecureButNonHttps = La galeta «%1$S» s'ha rebutjat perquè una galeta que no és HTTPS no es pot definir com a «secure».
# LOCALIZATION NOTE (CookieRejectedThirdParty): %1$S is the cookie response header.
CookieRejectedThirdParty = La galeta «%1$S» s'ha rebutjat perquè és de tercers.
# LOCALIZATION NOTE (CookieRejectedNonsecureOverSecure): %1$S is the cookie name.
CookieRejectedNonsecureOverSecure = La galeta «%1$S» s'ha rebutjat perquè ja existeix una galeta «secure».
# LOCALIZATION NOTE (CookieRejectedForNonSameSiteness): %1$S is the cookie name.
CookieRejectedForNonSameSiteness = La galeta «%1$S» s'ha rebutjat perquè es troba en un context entre llocs i el seu atribut «SameSite» és «Lax» o «Strict».
# LOCALIZATION NOTE (CookieRejectedPartitionedRequiresSecure): %1$S is the cookie name.
CookieRejectedPartitionedRequiresSecure = La galeta «%1$S» s'ha rebutjat perquè té l'atribut «Partitioned», però li manca l'atribut «secure».
# LOCALIZATION NOTE (CookieAttributeIgnored): %1$S is the cookie name. %2$S is the attribute name. %3$S is the number of bytes. "B" means bytes.
CookieAttributeIgnored = S'ha rebutjat el valor de l'atribut «%2$S» de la galeta «%1$S» perquè és massa gran. La mida màxima és %3$S B.
CookieAttributeOverwritten = S'ha sobreescrit el valor de l'atribut «%2$S» de la galeta «%1$S».
# LOCALIZATION NOTE (CookieForeignNoPartitionedWarning): %1$S is the cookie name. Do not translate "Partitioned"
CookieForeignNoPartitionedWarning = Aviat es rebutjarà la galeta «%1$S» perquè és de tercers i no té l'atribut «Partitioned».
# LOCALIZATION NOTE (CookieForeignNoPartitionedError): %1$S is the cookie name. Do not translate "Partitioned"
CookieForeignNoPartitionedError = La galeta «%1$S» s'ha rebutjat perquè és de tercers i no té l'atribut «Partitioned».
# LOCALIZATION NOTE (CookieBlockedCrossSiteRedirect): %1$S is the cookie name. Do not translate "SameSite", "Lax" or "Strict".
CookieBlockedCrossSiteRedirect = S'ha omès la galeta «%1$S», que té l'atribut «SameSite» amb el valor «Lax» o «Strict», a causa d'una redirecció entre llocs.
# LOCALIZATION NOTE (APIDeprecationWarning): %1$S is the deprecated API; %2$S is the API function that should be used.
APIDeprecationWarning = Avís: «%1$S» està en desús; utilitzeu «%2$S»
# LOCALIZATION NOTE (ResourceBlockedCORS): %1$S is the url of the resource blocked by ORB. $2$S is the reason.
# example: The resource at <url> was blocked by OpaqueResponseBlocking. Reason: “nosniff with either blocklisted or text/plain”.
ResourceBlockedORB = S'ha blocat el recurs de «%1$S» per OpaqueResponseBlocking. Motiu: «%2$S».
InvalidHTTPResponseStatusLine = La línia d'estat de la resposta HTTP no és vàlida
# LOCALIZATION NOTE (LocalNetworkAccessDetected): %1$S is top-level site, %2$S is initiator, %3$S is target URL, %4$S is target IP, %5$S is port, %6$S is mechanism (e.g., fetch, xhr, websocket), %7$S is secure context (true or false), %8$S is prompt action (values: "Allow", "Deny", or "(empty)" if no prompt shown)
LocalNetworkAccessDetected = S'ha detectat un accés a la xarxa local: lloc de primer nivell «%1$S», iniciador «%2$S», que accedeix a la destinació «%3$S» (%4$S:%5$S) mitjançant %6$S. Context segur: %7$S, acció de la sol·licitud de permís: %8$S
# LOCALIZATION NOTE (LocalNetworkAccessPermissionRequired): %1$S is top-level site, %2$S is initiator, %3$S is target URL, %4$S is target IP, %5$S is port, %6$S is mechanism (e.g., fetch, xhr, websocket), %7$S is secure context (true or false)
LocalNetworkAccessPermissionRequired = Cal el permís d'accés a la xarxa local: lloc de primer nivell «%1$S», iniciador «%2$S», que intenta accedir a la destinació «%3$S» (%4$S:%5$S) mitjançant %6$S. Context segur: %7$S
