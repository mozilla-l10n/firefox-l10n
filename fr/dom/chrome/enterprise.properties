blockedByPolicyEnterprise = Ce site web a été bloqué par votre entreprise.\nVotre entreprise applique des restrictions qui empêchent l’accès à certains sites pour des raisons de sécurité, de conformité ou de productivité.
# LOCALIZATION NOTE (profileNotEncryptedButPrefOnEnterprise): %S is the application name.
profileNotEncryptedButPrefOnEnterprise = %S exige désormais un stockage chiffré, mais votre profil actuel n’est pas protégé. Un nouveau profil chiffré sera créé et la synchronisation restaurera la plupart de vos données.\n\nNous vous recommandons vivement de supprimer l’ancien profil, car son archivage le laisserait sans protection sur le disque.
