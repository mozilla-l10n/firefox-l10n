loginsDescriptionAll2 = Հետեւեալ կայքերի մուտքագրումները պահուում են ձեր համակարգչում:
# LOCALIZATION NOTE (useASecurelyGeneratedPassword):
# Shown in the autocomplete popup to allow filling a generated password into a password field.
useASecurelyGeneratedPassword = Աւգտագործէք անվտանգ ձեւաւորուած գաղտնաբառ
# LOCALIZATION NOTE (generatedPasswordWillBeSaved):
# %S will contain the brandShorterName. This informs the user that the generated password will be automatically saved.
generatedPasswordWillBeSaved = %S-ը այս կայքի համար կպահպանի գաղտնաբառը։
# LOCALIZATION NOTE (loginHostAge):
# This is used to show the context menu login items with their age.
# 1st string is the username for the login, 2nd is the login's age.
loginHostAge = %1$S (%2$S)
# LOCALIZATION NOTE (noUsername):
# String is used on the context menu when a login doesn't have a username.
noUsername = Չկայ աւգտանուն
# LOCALIZATION NOTE (displaySameOrigin):
# String is used on the autocomplete row when the login origin is a domain match with the document origin
displaySameOrigin = Այս կայքից
# LOCALIZATION NOTE (insecureFieldWarningDescription2):
# %1$S will contain insecureFieldWarningLearnMore and look like a link to indicate that clicking will open a tab with support information.
insecureFieldWarningDescription2 = Այս կապակցումն անվտանգ չէ։ Այստեղ մուտքագրուած տուեալները կարող են բացահայտուել: %1$S
insecureFieldWarningLearnMore = Իմանալ աւելին
