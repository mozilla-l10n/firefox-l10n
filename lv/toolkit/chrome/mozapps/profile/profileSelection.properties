# Storage encryption mismatch (database-at-rest)
# LOCALIZATION NOTE (profileEncryptedButPrefOff, profileNotEncryptedButPrefOn): %S is the application name.
profileEncryptedButPrefOff = Jūsu %S profilam ir šifrētas datubāzes, taču šī %S versija ir konfigurēta tā, lai tās atvērtu nešifrētas. Lai izvairītos no profila bojāšanas, %S netiks startēts. Iespējojiet datubāzes šifrēšanu iestatījumos vai politikā un mēģiniet vēlreiz.
profileEncryptedButPrefOffTitle = Šifrēts profils
profileNotEncryptedButPrefOn = Jūsu %S profilā ir nešifrētas datubāzes, taču šī %S versija ir konfigurēta tā, lai būtu nepieciešama šifrēšana. %S nevar automātiski migrēt esošos datus. Lai turpinātu, atspējojiet šifrēšanas prasību vai izmantojiet jaunu profilu.
profileNotEncryptedButPrefOnTitle = Nepieciešama profila migrācija
