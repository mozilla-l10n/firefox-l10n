# Mixed Content Blocker
# LOCALIZATION NOTE: "%1$S" is the URI of the blocked mixed content resource
BlockMixedDisplayContent = Liegta jaukta ekrāna satura “%1$S” ielādēšana
BlockMixedActiveContent = Liegta jaukta aktīvā satura “%1$S” ielādēšana
# CORS
# LOCALIZATION NOTE: Do not translate "Access-Control-Allow-Origin", Access-Control-Allow-Credentials, Access-Control-Allow-Methods, Access-Control-Allow-Headers
CORSDisabled = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: CORS deaktivēts).
CORSDidNotSucceed2 = Dažādu izcelsmju pieprasījums bloķēts: Vienas izcelsmes politika neļauj lasīt attālo resursu vietnē %1$S. (Iemesls: CORS pieprasījums neizdevās). Statusa kods: %2$S.
CORSOriginHeaderNotAdded = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S. (Iemesls: CORS galveni ‘Origin’ nevar pievienot).
CORSExternalRedirectNotAllowed = Dažādu izcelsmju pieprasījums ir liegts: vienas izcelsmes pamatnostādne neatļauj ielasīt no attālināta avota %1$S. (Iemesls: CORS pieprasījuma ārējā pārvirzīšana nav atļauta.)
CORSRequestNotHttp = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: CORS pieprasījums nav http).\u0020
CORSMissingAllowOrigin2 = Dažādu izcelsmju pieprasījums bloķēts: vienas un tās pašas izcelsmes politika neļauj lasīt attālo resursu %1$S. (Iemesls: trūkst CORS galvenes “Access-Control-Allow-Origin”). Statusa kods: %2$S.
CORSMultipleAllowOriginNotAllowed = Cross-Origin Request Blocked: The Same Origin Policy disallows reading the remote resource at %1$S. (Reason: Multiple CORS header ‘Access-Control-Allow-Origin’ not allowed).
CORSAllowOriginNotMatchingOrigin = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: CORS pieprasījumam trūkst galvene 'Access-Control-Allow-Origin' neatbilst '%2$S').
CORSNotSupportingCredentials = Dažādu izcelsmju pieprasījumu liegts: Vienas izcelsmes politikas neatļauj lasīt attālo resursu ‘ %1$S’. (Iemesls: Akreditācija netiek atbalstīta, ja CORS galvene ‘Access-Control-Allow-Origin’ ir ‘*’).
CORSMethodNotFound = Dažādu izcelsmju pieprasījums ir aizturēts: vienas izcelsmes pamatnostādne neatļauj ielasīt no attāla avota, kas atrodas %1$S. (Iemesls: neatrada veidu CORS galvenē ‘Access-Control-Allow-Methods’).
CORSMissingAllowCredentials = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: tika gaidīs 'true' CORS galvenē 'Access-Control-Allow-Credentials').\u0020
CORSPreflightDidNotSucceed3 = Dažādu izcelsmju pieprasījums ir bloķēts: vienas un tās pašas izcelsmes politika neļauj lasīt attālo resursu vietnē %1$S. (Iemesls: CORS pirmsdrukas atbilde nebija veiksmīga). Statusa kods: %2$S.
CORSInvalidAllowMethod = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: nederīga virkne '%2$S' CORS galvenē 'Access-Control-Allow-Methods').
CORSInvalidAllowHeader = Dažādu izcelsmju pieprasījums ir bloķēs: Vienas izcelsmes politika neatļauj ielasīt no attālināta resursa %1$S (Iemesls: nederīga virkne '%2$S' CORS galvenē 'Access-Control-Allow-Headers').\u0020
CORSMissingAllowHeaderFromPreflight2 = Dažādu izcelsmju pieprasījums ir bloķēts: vienas un tās pašas izcelsmes politika neļauj lasīt attālo resursu %1$S. (Iemesls: galvene “%2$S” nav atļauta saskaņā ar CORS pirmsdrukas atbildes galveni “Access-Control-Allow-Headers”).
CORSAllowHeaderFromPreflightDeprecation = Dažādas izcelsmes pieprasījuma brīdinājums: Tās pašas izcelsmes politika drīzumā neļaus lasīt attālināto resursu %1$S. (Iemesls: ja `Access-Control-Allow-Headers` ir `*`, `Authorization` galvene nav iekļauta. Lai iekļautu `Authorization` galveni, tai ir jābūt skaidri norādītai CORS galvenē `Access-Control-Allow-Headers`).
# LOCALIZATION NOTE: Do not translate "Strict-Transport-Security", "HSTS", "max-age" or "includeSubDomains"
STSUnknownError = Strict-Transport-Security: Notikusi nezināma kļūda apstrādājot lapas piedāvāto galveni.
STSCouldNotParseHeader = Strict-Transport-Security: Vietne norādīja galveni, ko nevarēja apstrādāt.
STSNoMaxAge = Strict-Transport-Security: Lapas norādītā galvene nesaturēja 'max-age' direktīvu.
STSMultipleMaxAges = Strict-Transport-Security: Lapas norādītā galveni ar vairākām 'max-age' direktīvām.
STSInvalidMaxAge = Strict-Transport-Security: Lapa norādīja galveni, ar nederīgu 'max-age' direktīvu.
STSMultipleIncludeSubdomains = Strict-Transport-Security: Lapas norādītā galveni ar vairākām 'includeSubDomain' direktīvām.
STSInvalidIncludeSubdomains = Strict-Transport-Security: Lapa norādīja galveni, ar nederīgu 'includeSubDomains' direktīvu.
STSCouldNotSaveState = Strict-Transport-Security: Notikusi kļūda, kas atzīmē lapu kā Strict-Transport-Security serveri.
InsecurePasswordsPresentOnPage = Paroles lauks nedrošā lapā (http://). Šis ir drošības risks, kas var novest pie lietotāja datu zādzības.
InsecureFormActionPasswordsPresent = Paroles lauks formā ar nedrošu apstrādes adresi (http://). Šis ir drošības risks, kas var novest pie lietotāja datu zādzības.
InsecurePasswordsPresentOnIframe = Paroles lauks nedrošā iframe (http://). Šis ir drošības risks, kas var novest pie lietotāja datu zādzības.
# LOCALIZATION NOTE: "%1$S" is the URI of the insecure mixed content resource
LoadingMixedActiveContent2 = Drošā lapā tiek ielādēts jaukts (nedrošs) aktīvais saturs "%1$S"
LoadingMixedDisplayContent2 = Drošā lapā tiek ielādēts jaukts (nedrošs) attēlošanas saturs "%1$S"\u0020
# LOCALIZATION NOTE: "%S" is the URI of the insecure mixed content download
MixedContentBlockedDownload = Nedroša satura “%S” lejupielāde ir bloķēta.
# LOCALIZATION NOTE: Do not translate "allow-scripts", "allow-same-origin", "sandbox" or "iframe"
BothAllowScriptsAndSameOriginPresent = iframe ar abiem allow-scripts un allow-same-origin kā tā nošķirtās vides īpašībām var noņemt tā nošķirto vidi.
# LOCALIZATION NOTE: Do not translate "allow-top-navigation-by-user-activation", "allow-top-navigation", "sandbox" or "iframe"
BothAllowTopNavigationAndUserActivationPresent = iframe, kuram smilškastes atribūtam ir gan “allow-top-navigation”, gan “allow-top-navigation-by-user-activation”, atļaus augšējās navigācijas.
# Sub-Resource Integrity
# LOCALIZATION NOTE: Do not translate "script" or "integrity". "%1$S" is the invalid token found in the attribute.
MalformedIntegrityHash = Skripta elementam ir defektīva hash vērtība integrity atribūtā: "%1$S". Pareizs formāts ir  "<hash algorithm>-<hash value>".
# LOCALIZATION NOTE: Do not translate "integrity"
InvalidIntegrityLength = Integritātes atribūta hash vērtībai ir nepareizs garums.
# LOCALIZATION NOTE: Do not translate "integrity"
InvalidIntegrityBase64 = Integritātes atribūta hash vērtību nevarēja atkodēt.
# LOCALIZATION NOTE: Do not translate "integrity". "%1$S" is the type of hash algorithm in use (e.g. "sha256"). "%2$S" is the URI of the sub-resource. "%3$S" is the hash value we saw.
IntegrityMismatch3 = Neviens no atribūtā “integrity” norādītajiem “%1$S” jaucējkodiem neatbilst apakšresursa “%2$S” saturam. Aprēķinātais jaucējkods ir “%3$S”.
# LOCALIZATION NOTE: "%1$S" is the URI of the sub-resource that cannot be protected using SRI.
IneligibleResource = "%1$S" nevar izmantot integritātes pārbaudes, jo tas nav nedz CORS-aktivēts nedz same-origin.
# LOCALIZATION NOTE: Do not translate "integrity". "%1$S" is the invalid hash algorithm found in the attribute.
UnsupportedHashAlg = Neatbalstīs integritātes atribūta hash algoritms "%1$S"
# LOCALIZATION NOTE: Do not translate "integrity"
NoValidMetadata = Integritātes atribūtā nav derīgu metadatu.
# LOCALIZATION NOTE: Do not translate "RC4".
WeakCipherSuiteWarning = Šī lapa izmanto šifrētāju RC4, kas ir novecojis un nav drošs.\u0020
DeprecatedTLSVersion2 = Šī vietne izmanto nevēlamu TLS versiju. Lūgums jaunināt uz TLS 1.2 vai 1.3.
# XCTO: nosniff
# LOCALIZATION NOTE: Do not translate "X-Content-Type-Options: nosniff".
MimeTypeMismatch2 = Resurss no “%1$S” tika bloķēts MIME veida (“%2$S”) neatbilstības dēļ (X-Content-Type-Options: nosniff).
# LOCALIZATION NOTE: Do not translate "X-Content-Type-Options" and also do not translate "nosniff".
XCTOHeaderValueMissing = X-Content-Type-Options galvenes brīdinājums: vērtība bija “%1$S”; vai vēlējies sūtīt “nosniff”?
# LOCALIZATION NOTE: Do not translate "X-Content-Type-Options" and also do not translate "nosniff".
XTCOWithMIMEValueMissing = Resurss no “%1$S” netika parādīts, jo MIME veids nav zināms, ir nepareizs vai nav norādīts (X-Content-Type-Options: nosniff).
BlockScriptWithWrongMimeType2 = Skripts no “%1$S” tika bloķēts neatļauta MIME tipa (“%2$S”) dēļ.
WarnScriptWithWrongMimeType = Skripts no “%1$S” tika ielādēts, lai gan tā MIME tips (“%2$S”) nav derīgs JavaScript MIME tips.
# LOCALIZATION NOTE: Do not translate "importScripts()"
BlockImportScriptsWithWrongMimeType = Skripta ielāde no “%1$S” ar importScripts() tika bloķēta neatļauta MIME tipa (“%2$S”) dēļ.
BlockWorkerWithWrongMimeType = Darbinieka ielāde no “%1$S” tika bloķēta neatļauta MIME tipa (“%2$S”) dēļ.
BlockModuleWithWrongMimeType = Moduļa ielāde no “%1$S” tika bloķēta neatļauta MIME tipa (“%2$S”) dēļ.
BlockJsonModuleWithWrongMimeType = JSON moduļa ielāde no “%1$S” tika bloķēta neatļauta MIME tipa (“%2$S”) dēļ.
# LOCALIZATION NOTE: Do not translate "data: URI".
BlockTopLevelDataURINavigation = Pāreja uz augstākā līmeņa data:URI nav atļauta (Bloķē “%1$S” ielādi)
BlockRedirectToDataURI = Pārvirza uz datiem: URI nav atļauts (liegta “%1$S” ielādēšana)
# LOCALIZATION NOTE: Do not translate "file: URI". “%1$S” is the whole URI of the loaded file. “%2$S” is the MIME type e.g. "text/plain".
BlockFileScriptWithWrongMimeType = Skripta ielāde no faila: URI (“%1$S”) tika bloķēts, jo tā MIME tips (“%2$S”) nav derīgs JavaScript MIME tips.
# LOCALIZATION NOTE: “%S” is the whole URI of the loaded file.
BlockExtensionScriptWithWrongExt = Skripta ielāde ar URI “%S” tika bloķēta, jo faila paplašinājums nav atļauts.
RestrictBrowserEvalUsage = eval() un eval līdzīgu funkciju lietošana nav atļauta vecāku procesā vai sistēmas kontekstos (bloķēta lietošana “%1$S”).
# LOCALIZATION NOTE (MixedContentAutoUpgrade):
# %1$S is the URL of the upgraded request; %2$S is the upgraded scheme.
MixedContentAutoUpgrade = Nedroša attēlošanas pieprasījuma “%1$S” jaunināšana, lai izmantotu “%2$S”
# LOCALIZATION NOTE (RunningClearSiteDataValue):
# %S is the URI of the resource whose data was cleaned up
RunningClearSiteDataValue = Clear-Site-Data galvene piespiedusi notīrīt “%S” datus.
UnknownClearSiteDataValue = Clear-Site-Data galvene atrasta. Vērtība nav zināma “%S”.
# Reporting API
ReportingHeaderInvalidJSON = Ziņošanas galvene: saņemta nederīga JSON vērtība.
ReportingHeaderInvalidNameItem = Ziņojuma galvene: nederīgs grupas nosaukums.
ReportingHeaderDuplicateGroup = Ziņojuma galvene: ignorē dublētu grupu ar nosaukumu “%S”.
ReportingHeaderInvalidItem = Ziņojuma galvene: ignorē nederīgu vienumu ar nosaukumu “%S”.
ReportingHeaderInvalidEndpoint = Ziņošanas galvene: ignorē nederīgu galapunktu vienumam ar nosaukumu “%S”.
# LOCALIZATION NOTE(ReportingHeaderInvalidURLEndpoint): %1$S is the invalid URL, %2$S is the group name
ReportingHeaderInvalidURLEndpoint = Ziņojuma galvene: ignorē nederīgu galapunkta URL “%1$S” vienumam ar nosaukumu “%2$S”.
PermissionsPolicyUnsupportedFeatureName = Atļauju pamatnostādne: izlaiž neatbalstītu iespējas nosaukumu “%S”.
PermissionsPolicyInvalidEmptyAllowValue = Atļauju pamatnostādne: izlaiž tukšu atļaušanas saraksts iespējai “%S”.
PermissionsPolicyInvalidAllowValue = Atļauju pamatnostādne: izlaiž neatbalstītu atļaujošo vērtību “%S”.
FeaturePolicyUnsupportedFeatureName = Feature Policy: Skipping unsupported feature name “%S”.
# TODO: would be nice to add a link to the Feature-Policy MDN documentation here. See bug 1449501
FeaturePolicyInvalidEmptyAllowValue = Feature Policy: Skipping empty allow list for feature: “%S”.
# TODO: would be nice to add a link to the Feature-Policy MDN documentation here. See bug 1449501
FeaturePolicyInvalidAllowValue = Feature Policy: Skipping unsupported allow value “%S”.
# LOCALIZATION NOTE: "%1$S" is the limitation length (bytes) of referrer URI, "%2$S" is the origin of the referrer URI.
ReferrerLengthOverLimitation = HTTP atsauces galvene: Garums pārsniedz “%1$S” baitu ierobežojumu — atsauces galvene tiek noņemta līdz izcelsmei: “%2$S”
# LOCALIZATION NOTE: "%1$S" is the limitation length (bytes) of referrer URI, "%2$S" is the origin of the referrer URI.
ReferrerOriginLengthOverLimitation = HTTP atsauces galvene: Izcelsmes garums atsaucē pārsniedz “%1$S” baitu ierobežojumu — tiek noņemts atsauce ar izcelsmi “%2$S”.
# LOCALIZATION NOTE: Do not translate "no-referrer-when-downgrade", "origin-when-cross-origin" and "unsafe-url". %S is the URI of the loading channel.
ReferrerPolicyDisallowRelaxingWarning = Atsauces politika: starpvietņu pieprasījumam %S drīzumā tiks ignorētas mazāk ierobežojošas politikas, tostarp “no-referrer-when-downgrade”, “origin-when-cross-origin” un “unsafe-url”
# LOCALIZATION NOTE: %1$S is the ignored referrer policy, %2$S is the URI of the loading channel.
ReferrerPolicyDisallowRelaxingMessage = Atsauces politika: tiek ignorēta mazāk ierobežotā atsauces politika “%1$S” starpvietņu pieprasījumam: %2$S
# X-Frame-Options
# LOCALIZATION NOTE(XFrameOptionsInvalid): %1$S is the header value, %2$S is frame URI. Do not translate "X-Frame-Options".
XFrameOptionsInvalid = Ielādējot “%2$S”, tika atrasta nederīga X-Frame-Options galvene: “%1$S” nav derīga direktīva.
# LOCALIZATION NOTE(XFrameOptionsDeny): %1$S is the header value, %2$S is frame URI and %3$S is the parent document URI. Do not translate "X-Frame-Options".
XFrameOptionsDeny = “%2$S” ielādi kadrā aizliedz direktīva “X-Frame-Options”, kas iestatīta uz “%1$S”.
# HTTPS-Only Mode
# LOCALIZATION NOTE: %1$S is the URL of the upgraded request; %2$S is the upgraded scheme.
HTTPSOnlyUpgradeRequest = Notiek nedroša pieprasījuma “%1$S” jaunināšana, lai izmantotu “%2$S”.
# LOCALIZATION NOTE: %1$S is the URL of request.
HTTPSOnlyNoUpgradeException = Nedrošs pieprasījums “%1$S” netiek jaunināts, jo tas ir izņēmums.
# LOCALIZATION NOTE: %1$S is the URL of the failed request; %2$S is an error-code.
HTTPSOnlyFailedRequest = Neizdevās jaunināt nedrošu pieprasījumu “%1$S”. (%2$S)
# LOCALIZATION NOTE: %S is the URL of the failed request;
HTTPSOnlyFailedDowngradeAgain = Neizdevās jaunināt nedrošu pieprasījumu “%S”. Atkārtoti tiek pazemināts uz “http”.
# LOCALIZATION NOTE: Hints or indicates a new transaction for a URL is likely coming soon. We use
# a speculative connection to start a TCP connection so that the resource is immediately ready
# when the transaction is actually submitted. HTTPS-Only and HTTPS-First will upgrade such
# speculative TCP connections from http to https.
# %1$S is the URL of the upgraded speculative TCP connection; %2$S is the upgraded scheme.
HTTPSOnlyUpgradeSpeculativeConnection = Notiek nedroša spekulatīva TCP savienojuma “%1$S” jaunināšana, lai izmantotu “%2$S”.
# Upgrades from http to https
# LOCALIZATION NOTE: %1$S is the mechanism that caused the upgrade, such as HSTS;
# %2$S is the URL of the upgraded request; %3$S is the upgraded scheme.
SecureUpgradeRequest = %1$S: uzlabo nedrošu pieprasījumu “%2$S”, lai tas izmantotu “%3$S”.
HTTPSFirstSchemeless = Adrešu joslā ielādētais URL tiek jaunināts bez skaidras protokola shēmas, lai izmantotu HTTPS.
# LOCALIZATION NOTE: %S is the hostname for which a exception will be added;
HTTPSFirstAddingException = Pievienojot izņēmumu, īslaicīgi tiek novērsti turpmāki mēģinājumi automātiski ielādēt “http://%S” droši.
# LOCALIZATION NOTE: %S is the URL of the blocked request;
IframeSandboxBlockedDownload = “%S” lejupielāde tika bloķēta, jo aktivizējošajam iframe ir iestatīts smilškastes karodziņš.
# LOCALIZATION NOTE: %S is the URL of the blocked request;
SandboxBlockedCustomProtocols = Bloķēta navigācija uz pielāgotu protokolu “%S” no smilškastes konteksta.
# Sanitizer API
