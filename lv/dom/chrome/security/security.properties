SanitizerAllowElementIgnored2 = Sanitizētājs: allowElement() izsaukšana ar “attributes” vai netukšu “removeAttributes” tika ignorēta globālā “removeElements” saraksta dēļ.
# LOCALIZATION NOTE: %S is the URI of the blocked script.
IntegrityPolicyEnforceBlockedScript = Lapas iestatījumi bloķēja skripta ielādi vietnē %S, jo tam trūkst integritātes metadatu.
# LOCALIZATION NOTE: %S is the URI of the blocked script.
IntegrityPolicyReportOnlyBlockedScript = (Tikai atskaites politika) Lapas iestatījumi bloķētu skripta ielādi vietnē %S, jo tam trūkst integritātes metadatu.
# LOCALIZATION NOTE: %S is the URI of the blocked stylesheet.
