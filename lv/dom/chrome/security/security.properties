# LOCALIZATION NOTE: %1$S is the header value. %2$S is the field name like destinations.
WAICTHeaderFieldParseError = WAICT: Neizdevās parsēt %2$S galvenē “%1$S”.
# LOCALIZATION NOTE: %1$S is the header value.
WAICTHeaderManifestParseError = WAICT: Neizdevās parsēt vai trūkst manifesta URL galvenē “%1$S”.
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTFetchingManifest = WAICT: Notiek integritātes manifesta izgūšana no “%1$S”.
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTManifestFetchURLParseError = WAICT: Neizdevās parsēt manifesta URL “%1$S”.
# LOCALIZATION NOTE: %1$S is the manifest URL.
WAICTManifestFetchError = WAICT: Neizdevās izgūt integritātes manifestu no “%1$S”.
WAICTManifestJSONParseError = WAICT: Neizdevās parsēt manifesta JSON failu.
# LOCALIZATION NOTE: %1$S is the URL. %2$S is the computed hash.
WAICTManifestInvalidHash = WAICT: Ierakstam “%1$S” manifestā ir nederīgs jaucējkods “%2$S”.
# LOCALIZATION NOTE: %1$S is the URL.
WAICTManifestInvalidURL = WAICT: Ieraksts “%1$S” manifestā ir nederīgs URL.
# LOCALIZATION NOTE: %1$S is the computed hash. Do not translate "any_hashes".
WAICTManifestInvalidAnyHash = WAICT: Manifestā ir nederīgs jaucējkoda “%1$S” “any_hashes” elementā.
