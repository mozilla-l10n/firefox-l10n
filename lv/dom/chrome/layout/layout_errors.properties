ImageMapRectBoundsError = Atribūts "coords" no <area shape="rect"> taga nav formātā "left,top,right,bottom".
ImageMapCircleWrongNumberOfCoords = Atribūts "coords" no <area shape="circle"> taga nav formātā "center-x,center-y,radius".
ImageMapCircleNegativeRadius = Atribūts "coords" no <area shape="circle"> taga ir ar negatīvu rādiusu.
ImageMapPolyWrongNumberOfCoords = Atribūts "coords" no <area shape="poly"> taga nav formātā "x1,y1,x2,y2 …".
ImageMapPolyOddNumberOfCoords = Atribūtam "coords" no <area shape="poly"> taga nav pēdējās y koordinātas (pareizais formāts ir "x1,y1,x2,y2 …").
ScrollLinkedEffectFound3 = Šķiet, ka šī vietne izmanto ar ritināšanu saistītu pozicionēšanas efektu. Tas var nedarboties labi ar asinhronu panoramēšanu; skatiet https://firefox-source-docs.mozilla.org/performance/scroll-linked_effects.html , lai iegūtu sīkāku informāciju un pievienotos diskusijai par saistītajiem rīkiem un funkcijām!
## LOCALIZATION NOTE(CompositorAnimationWarningContentTooLargeArea):
## %1$S is an integer value of the area of the frame
## %2$S is an integer value of the area of a limit based on the viewport size
CompositorAnimationWarningContentTooLargeArea = Animāciju nevar izpildīt kompozitorā, jo ietvara (%1$S) apgabals ir pārāk liels attiecībā pret skatu apgabalu (lielāks kā %2$S)
## LOCALIZATION NOTE(CompositorAnimationWarningContentTooLarge2):
## (%1$S, %2$S) is a pair of integer values of the frame size
## (%3$S, %4$S) is a pair of integer values of a limit based on the viewport size
## (%5$S, %6$S) is a pair of integer values of an absolute limit
CompositorAnimationWarningContentTooLarge2 = Animation cannot be run on the compositor because the frame size (%1$S, %2$S) is too large relative to the viewport (larger than (%3$S, %4$S)) or larger than the maximum allowed value (%5$S, %6$S)
## LOCALIZATION NOTE(CompositorAnimationWarningNonScalingStroke,
##                   CompositorAnimationWarningTransformSVG,
##                   CompositorAnimationWarningTransformFrameInactive,
##                   CompositorAnimationWarningOpacityFrameInactive):
## 'transform' and 'opacity' mean CSS property names, don't translate it.
CompositorAnimationWarningNonScalingStroke = Satura, kurā ir elementi ar nemērogojamām kontūrām, ‘transform’ animācijas nevar palaist kompozitorā
CompositorAnimationWarningTransformSVG = Animācijas ‘transform’ elementiem ar SVG transformācijām nevar izpildīt kompozitoram
CompositorAnimationWarningTransformFrameInactive = Datorā nevar palaist animācijas, jo ietvars nav atzīmēts kā aktīvs ‘transform’ animācijām
CompositorAnimationWarningTransformIsBlockedByImportantRules = Transformācijas animāciju nevar palaist kompozitorā, jo ar transformāciju saistītos rekvizītus pārraksta !important kārtulas
CompositorAnimationWarningOpacityFrameInactive = Datorā nevar palaist animācijas, jo ietvars nav atzīmēts kā aktīvs ‘opacity’ animācijām
CompositorAnimationWarningHasRenderingObserver = Animācijas nevar izpildīt kompozitorā, jo elementam ir renderēšanas novērotāji (-moz-element vai SVG izgriezumu/maskēšanas)
CompositorAnimationWarningHasCurrentColor = “Background-color” animācijas nevar palaist kompozicionētājā ar “current-color” atslēgkadru.
## LOCALIZATION NOTE(PrincipalWritingModePropagationWarning):
## Do not translate <html>, <body>, CSS, "writing-mode", "direction", "text-orientation", :root, and "The Principal Writing Mode" because they are technical terms.
PrincipalWritingModePropagationWarning = Renderējot <html> elementu, izmantotās CSS īpašību “writing-mode”, “direction” un “text-orientation” vērtības <html> elementā tiek ņemtas no <body> elementa aprēķinātajām vērtībām, nevis no paša <html> elementa vērtībām. Apsveriet iespēju iestatīt šīs īpašības :root CSS pseidoklasei. Plašāku informāciju skatiet sadaļā “The Principal Writing Mode” vietnē https://www.w3.org/TR/css-writing-modes-3/#principal-flow
## LOCALIZATION NOTE(ScrollAnchoringDisabledInContainer):
## %1$S is an integer value with the total number of adjustments
## %2$S is a floating point value with the average distance adjusted
## %3$S is a floating point value with the total adjusted distance
ScrollAnchoringDisabledInContainer = Ritināšanas konteinerā tika atspējota ritināšanas piesaiste pārāk daudzu secīgu korekciju (%1$S) dēļ ar pārāk mazu kopējo attālumu (vidēji %2$S pikseļi, kopā %3$S pikseļi).
ForcedLayoutStart = Izkārtojums tika piespiedu kārtā ielādēts pirms lapas pilnīgas ielādes. Ja stila lapas vēl nav ielādētas, tas var izraisīt nestilizēta satura uzplaiksnījumu.
