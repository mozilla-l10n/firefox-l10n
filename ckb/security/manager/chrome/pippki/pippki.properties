pageInfo_EncryptionWithBitsAndProtocol = پەیوەندی کلیلدراوە (%1$S، کلیلی %2$S بتی، %3$S)
pageInfo_BrokenEncryption = کلیدانی شکاو (%1$S، کلیلی %2$S بتی، %3$S)
