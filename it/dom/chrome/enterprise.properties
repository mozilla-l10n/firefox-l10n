blockedByPolicyEnterprise = Questo sito è stato bloccato dalla tua organizzazione.\nLa tua azienda ha imposto restrizioni di rete che vietano l’accesso ad alcuni siti web per ragioni di sicurezza, conformità o produttività.
# LOCALIZATION NOTE (profileNotEncryptedButPrefOnEnterprise): %S is the application name.
profileNotEncryptedButPrefOnEnterprise = %S ora richiede che i dati vengano salvati in forma crittata, ma il profilo esistente non è protetto. Verrà creato un nuovo profilo crittato e la sincronizzazione ripristinerà la maggior parte dei dati.\n\nÈ vivamente consigliato eliminare il vecchio profilo, poiché archiviandolo rimarrebbe sul disco senza protezioni.
# LOCALIZATION NOTE (profileMismatchDeleteAndContinue, profileMismatchKeepAndContinue, profileMismatchQuit): Button labels for the profile encryption migration dialog.
profileMismatchDeleteAndContinue = Elimina (consigliato)
profileMismatchKeepAndContinue = Archivia
profileMismatchQuit = Esci
