name: Run Fluent migrations

on:
  workflow_dispatch:
    inputs:
      firefox_version:
        description: "Firefox version the migration lands in (e.g. 160), recipes are moved to recipes/fx<version>"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: fluent-migrations

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      FM_REPO: mozilla-l10n/fluent-migrations
      SOURCE_REPO: mozilla-l10n/firefox-l10n-source
      SOURCE_BRANCH: update
      FM_PATH: fluent-migrations
      L10N_PATH: firefox-l10n
      SOURCE_PATH: firefox-l10n-source
      SCRIPT: automation/.github/scripts/fluent_migration.py
      BRANCH_NAME: update-migration
      FM_BRANCH_NAME: move-recipes-${{ github.run_id }}
      FIREFOX_VERSION: ${{ inputs.firefox_version }}
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Checkout fluent-migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.FM_PATH }}
          repository: ${{ env.FM_REPO }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check for recipes
        id: recipes
        run: python "$SCRIPT" check

      - name: Checkout firefox-l10n-source
        if: steps.recipes.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.SOURCE_PATH }}
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          persist-credentials: false
      - name: Checkout firefox-l10n
        if: steps.recipes.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.L10N_PATH }}
          ref: main
          # Full history is needed for blame to preserve attribution
          fetch-depth: 0
          persist-credentials: false
      - name: Run migrations
        if: steps.recipes.outputs.found == 'true'
        run: python "$SCRIPT" migrate
      - name: Create PRs
        if: steps.recipes.outputs.found == 'true'
        run: python "$SCRIPT" create-prs
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
